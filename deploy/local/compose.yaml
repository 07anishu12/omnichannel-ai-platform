services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: omnichannel_local
      MYSQL_USER: omnichannel_app
      MYSQL_PASSWORD: local-app-password
      MYSQL_ROOT_PASSWORD: local-root-password
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - omnichannel_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -plocal-root-password --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - omnichannel_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.15.5
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - omnichannel_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6333/readyz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  omnichannel_mysql_data:
  omnichannel_redis_data:
  omnichannel_qdrant_data:
